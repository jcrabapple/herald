name: Kanban preview APK

on:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: "25"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the debug preview gallery
        run: >-
          ./gradlew :androidApp:assembleDebug --no-daemon --max-workers=1
          -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kanban-main-preview-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 1

  screenshots:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kanban-main-preview-apk
          path: apk
      - name: Enable KVM for the hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            adb install apk/androidApp-debug.apk
            adb shell am force-stop dev.herald.android
            adb shell am start -n dev.herald.android/dev.hermeskotlin.android.PreviewGalleryActivity --es scene Kanban --ez dark true
            sleep 20
            adb exec-out screencap -p > kanban-main-dark.png
            adb shell am force-stop dev.herald.android
            adb shell am start -n dev.herald.android/dev.hermeskotlin.android.PreviewGalleryActivity --es scene Kanban --ez dark false
            sleep 15
            adb exec-out screencap -p > kanban-main-light.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kanban-main-screenshots
          path: kanban-main-*.png
          if-no-files-found: error
          retention-days: 1
